[project]
name = "docstrap"
version = "0.0.3"
description = "User-scoped documentation publishing tool. Discovers projects via .docstrap files, builds them via Sphinx, aggregates cross-project."
authors = [{ name = "esotericbyte" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.25.1",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sphinx>=9.1.0",
    "myst-parser>=5.1.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "furo>=2025.12.19",
    "pagefind[bin]>=1.5.2",
    "python-slugify>=8.0.4",
    "linkify-it-py>=2.1.0",
    "ruamel-yaml>=0.19.1",
    "pluggy>=1.6.0",
]

[project.scripts]
docstrap = "docstrap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docstrap"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
